<text x="13.000" y="223.600" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">1. Kích thước ghi bằng mm, cao độ ghi bằng m. Kích thước khu đất là kích thước LỌT LÒNG (mặt trong tường biên).</text>
<text x="13.000" y="226.567" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   Chiều dày tường biên chưa có số liệu – thể hiện tượng trưng.</text>
<text x="13.000" y="229.534" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">2. Chuỗi chiều dài theo kích thước HOÀN THIỆN block 820:  1.580 + 11×820 + 10×530 + 2.500 = 18.400. Khoảng 530</text>
<text x="13.000" y="232.501" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   đo giữa 2 mép ngoài hoàn thiện. (780 là phần xây – chỉ dùng ở trang 2.)</text>
<text x="13.000" y="235.468" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">3. Chuỗi ngang tại đoạn rộng 8.240:  500 + 3.070 + 1.200 + 3.070 + 400 = 8.240. Tại đoạn trong:  100 + 3.070 +</text>
<text x="13.000" y="238.435" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   1.200 + 3.070 + 400 = 7.840. Lối đi 1.200 đo giữa 2 mép ngoài block.</text>
<text x="13.000" y="241.402" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">4. Mỗi block 3.070 = móng/đế 200 + phần xây hoàn thiện 6 hộc 2.670 + móng/đế 200. Móng/đế 200 – KHÔNG PHẢI HỘC</text>
<text x="13.000" y="244.369" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   MỘ.</text>
<text x="13.000" y="247.336" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">5. CẦN XÁC NHẬN: theo chuỗi ngang ở mục 3, tim lối đi cách cạnh Tây 4.070, cách cạnh Đông 4.170, lệch 50 về phía</text>
<text x="13.000" y="250.303" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   Tây so với điểm giữa cạnh 8.240 (4.120). Bản vẽ giữ tim cổng = tim lối đi = tim am thờ (thẳng trục) nên cổng</text>
<text x="13.000" y="253.270" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   cách cạnh Tây 3.070 / cạnh Đông 3.170.</text>
<text x="13.000" y="256.237" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">6. AM THỜ vẽ tượng trưng (nét đứt), kích thước chờ bổ sung. Phía lệch của góc 9° thể hiện theo giả định B9°Đ –</text>
<text x="13.000" y="259.204" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.15" text-anchor="start" font-weight="normal" fill="#000">   chờ xác nhận.</text>

<text x="353.000" y="82.800" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">1. Hộc lọt lòng 680×380; tường gạch 50; phủ bì</text>
<text x="353.000" y="85.650" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   xây 1 hộc 780×480.</text>
<text x="353.000" y="88.500" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">2. Chiều 680: 680 + 2×50 = 780 (xây) + 2×20 =</text>
<text x="353.000" y="91.350" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   820 (hoàn thiện).</text>
<text x="353.000" y="94.200" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">3. Chiều 6 hộc: 6×380 + 7×50 + 40 = 2.670; 200 +</text>
<text x="353.000" y="97.050" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   2.670 + 200 = 3.070.</text>
<text x="353.000" y="99.900" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">4. Hoàn thiện 20/mặt = tô trát 10 + ốp gạch 10,</text>
<text x="353.000" y="102.750" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   chỉ ở phần nổi (±0.000 → +0.100). Phần tường</text>
<text x="353.000" y="105.600" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   dưới cốt nền không tô trát.</text>
<text x="353.000" y="108.450" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">5. Tấm BTCT chống lún dày 100 dưới mỗi block;</text>
<text x="353.000" y="111.300" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   mỗi hộc 1 lỗ âm dương xuyên tấm (6 lỗ/block),</text>
<text x="353.000" y="114.150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   không đổ bê tông kín vị trí lỗ. Kích thước và</text>
<text x="353.000" y="117.000" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   vị trí lỗ âm dương chờ xác nhận.</text>
<text x="353.000" y="119.850" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">6. Móng bao gạch thẻ rộng 200, trên có giằng</text>
<text x="353.000" y="122.700" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   BTCT dày ~150. Cao độ, chiều sâu móng/đế và</text>
<text x="353.000" y="125.550" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   khe 20 sát tường: tạm thể hiện – chờ xác</text>
<text x="353.000" y="128.400" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   nhận.</text>
<text x="353.000" y="131.250" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">7. 780 là KT phần xây, 820 là KT sau hoàn thiện</text>
<text x="353.000" y="134.100" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   – không dùng lẫn trong cùng một chuỗi kích</text>
<text x="353.000" y="136.950" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">   thước mặt bằng.</text>
<text x="353.000" y="139.800" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="2.05" text-anchor="start" font-weight="normal" fill="#000">8. Chiều sâu hộc ~1.000, cốt đáy dự kiến</text>
